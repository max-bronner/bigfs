name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:

# The build only reads the repository; nothing it runs needs a write token
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type check, lint, unit tests, then the integration suite, which starts
      # VS Code and so needs a display
      - run: xvfb-run -a npm test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
        shell: bash
      # Failures as one annotation, readable from the checks API and the PR
      - if: failure()
        shell: bash
        run: |
          failures=$(grep -E -A14 '^\s+[0-9]+\) ' test.log | head -150 || tail -60 test.log)
          echo "::error title=Test failures::${failures//$'\n'/%0A}"
      - run: npm run vsix
      # The installable build of this commit, under the run's artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bigfs-vsix
          path: bigfs.vsix
