name: CI

on:
  push:
    branches-ignore: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type check, lint, unit tests, then the integration suite, which starts
      # VS Code and so needs a display
      - run: xvfb-run -a npm test
